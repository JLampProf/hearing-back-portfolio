<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearing Back</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <section class="cta">
      <div class="cta-main">
        <div class="cta-main-header">
          <h1>Want your hearing back?</h1>
          <h3>Let us help!</h3>
        </div>
        <div class="form-block">
          <h3>
            Enter your details below, and we'll get back to you within 24 hours!
          </h3>
          <form class="form">
            <div class="form-row">
              <label class="form-label" for="name">Name:</label>
              <input class="form-input" type="text" name="name" id="name" />
            </div>
            <div class="form-row">
              <label class="form-label" for="email">Email:</label>
              <input class="form-input" type="text" name="email" id="email" />
            </div>
            <div class="form-row">
              <button class="submit-button" type="submit" id="submitButton">
                Submit
              </button>
            </div>
          </form>
        </div>
      </div>
      <div class="cta-img">
        <img class="hearing-aids" src="./Images/hearing_aids.png" alt="" />
      </div>

    <footer class="footer">
      <h1>Hearing Back inc.</h1>
